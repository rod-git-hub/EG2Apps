# Weekly upgrade proposals as pull requests, 7 days after a release (the ship rule).
# An npm upgrade PR fails the approved-packages gate until docs/reference/approved-packages.md
# is updated in the same PR. That's intentional: every upgrade gets a deliberate review.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-all:
        patterns: ["*"]
    # @types/node follows the Node.js LTS we run (24): no proposals for a newer major.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The Even CLI stays on 0.1.x until 0.2.0 has been tested (decided 2026-10-21).
      - dependency-name: "@evenrealities/evenhub-cli"
        update-types: ["version-update:semver-minor"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
